name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 記事リポジトリ（denken-articles）の更新で起動する
  repository_dispatch:
    types: [articles-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 記事は別リポジトリ（osu-denken/denken-articles）を posts/ に取り込む
      - uses: actions/checkout@v4
        with:
          repository: osu-denken/denken-articles
          path: posts
          fetch-depth: 1
          persist-credentials: false

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.141.0"
          extended: true

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ hashFiles('assets/**', 'hugo.toml', 'go.sum') }}
          restore-keys: hugo-

      - run: hugo --minify --gc
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
