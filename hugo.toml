baseURL = "https://osu-denken.net/blog/"
languageCode = "ja"
timeZone = "Asia/Tokyo"
title = "電研ブログ"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

# RSS は今の URL（/feed.xml）を保つ
[outputFormats.RSS]
  baseName = "feed"

# 記事の URL は Jekyll のときと同じ形（/2025/07/23/tailscale.html）
[permalinks]
  posts = "/:year/:month/:day/:slug/"

# ファイル名の先頭の日付（2025-07-23-tailscale.md）から日付と URL の名前を取る（Jekyll と同じ）
[frontmatter]
  date = [":filename", ":default"]

# 記事はフォルダではなくファイル（/2025/07/23/tailscale.html）で出す
[uglyURLs]
  posts = true

[markup.goldmark.extensions]
  linkify = true

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$'], ['\[', '\]']]
    inline = [['\(', '\)']]

[params]
  description = "大阪産業大学 文化会 電子計算研究部の公式ブログ。活動報告や制作物、部員による発信をしています。"
  headerTitle = "電研"
  author = "大阪産業大学 文化会 電子計算研究部"

# 管理画面（gh-admin）の設定。記事リポジトリが決まるまで架空のリポジトリを指す
[params.ghAdmin]
  repo = "owner/denken-test-articles"
  postURL = "/{yyyy}/{mm}/{dd}/{name}.html"
  branch = "main"

[[module.imports]]
  path = "github.com/kmmz532/hugo-gh-admin"

[[module.imports]]
  path = "github.com/kmmz532/hugo-shortcodes"
