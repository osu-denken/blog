title = "電研ブログ"
baseURL = "https://osu-denken.net/blog/"
languageCode = "ja"
timeZone = "Asia/Tokyo"
timeout = "5m"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

# 旧サイトの /search.json（記事の配列）を同じ URL で出す
[outputFormats.SEARCHJSON]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "SEARCHJSON"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

# RSS は今の URL（/feed.xml）を保つ
[outputFormats.RSS]
  baseName = "feed"

# 記事の URL は Jekyll のときと同じ形（/2025/07/23/tailscale.html）
[permalinks]
  posts = "/:year/:month/:day/:slug/"

# ファイル名の先頭の日付（2025-07-23-tailscale.md）から日付と URL の名前を取る（Jekyll と同じ）
[frontmatter]
  date = [":filename", ":default"]

# 記事はフォルダではなくファイル（/2025/07/23/tailscale.html）で出す
[uglyURLs]
  posts = true

[markup.goldmark.extensions]
  linkify = true

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$'], ['\[', '\]']]
    inline = [['\(', '\)']]

[params]
  description = "大阪産業大学 文化会 電子計算研究部の公式ブログ。活動報告や制作物、部員による発信をしています。"
  headerTitle = "電研"
  # 公式サイト（ログインのトークンは、このサイトと同じ origin に保存される）
  officialURL = "https://osu-denken.net/"
  author = "電子計算研究部"
  # front matter に author が無い記事に出す GitHub のユーザー名
  defaultAuthor = "osu-denken"
  # フッターに出す名前（サイドバーの名前とは別）
  footer = "大阪産業大学 文化会 電子計算研究部"

# サイドバーのリンク（URL が空なら出さない）
[[params.links]]
  name = "公式サイト"
  url = "https://osu-denken.github.io/"
  icon = "fa-solid fa-house"
[[params.links]]
  name = "GitHub"
  url = "https://github.com/osu-denken"
  icon = "fa-brands fa-github"
[[params.links]]
  name = "Twitter"
  url = "https://x.com/OSU_denken"
  icon = "fa-brands fa-twitter"
[[params.links]]
  name = "Instagram"
  url = "https://www.instagram.com/osu_denken/"
  icon = "fa-brands fa-instagram"

# 管理画面（gh-admin）の設定。記事リポジトリが決まるまで架空のリポジトリを指す
[params.ghAdmin]
  author = "osu-denken"
  authorField = true
  # 公式サイトのログイン（idToken）で GitHub のトークンを受け取る（static/js/gh-token.js）
  tokenProvider = "js/gh-token.js"
  repo = "osu-denken/denken-articles"
  postURL = "/{yyyy}/{mm}/{dd}/{name}.html"
  branch = "main"

# 記事と画像は記事リポジトリ（osu-denken/denken-articles）を posts/ に clone して取り込む
[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "posts/content"
  target = "content"
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "posts/static"
  target = "static"

[[module.imports]]
  path = "github.com/kmmz532/hugo-gh-admin"

[[module.imports]]
  path = "github.com/kmmz532/hugo-shortcodes"
