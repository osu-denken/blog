<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <div class="layout">
    <main class="contents">
      {{ block "main" . }}{{ end }}
    </main>
  </div>
  {{ partial "footer.html" . }}
  <div class="options">
    <button type="button" id="theme-toggle" aria-label="ダークモードを切り替える" title="ダークモードを切り替える">
      <i class="fa-solid fa-moon icon" aria-hidden="true"></i>
    </button>
  </div>
  <script src="{{ "js/theme.js" | relURL }}" type="module"></script>
  {{ partial "pending-templates.html" . }}
  {{ block "scripts" . }}{{ end }}
</body>
</html>
