{{ define "main" }}
<form class="search-box" action="{{ "search.html" | relURL }}" method="get" role="search">
  <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
  <input type="search" name="q" class="search-input" placeholder="記事を検索..." aria-label="記事を検索" autocomplete="off">
</form>
{{- $pag := .Paginate (where site.RegularPages "Section" "posts") }}
{{ partial "pagination.html" $pag }}
<ul class="cardlist" data-pending-target="list" data-page="{{ $pag.PageNumber }}">
  {{- range $pag.Pages }}
  {{ partial "post-card.html" . }}
  {{- end }}
</ul>
{{ partial "pagination.html" $pag }}
{{ end }}

{{ define "scripts" }}
<script src="{{ "js/denken/private-api.js" | relURL }}"></script>
<script src="{{ "js/denken/private-list.js" | relURL }}"></script>
{{ end }}
