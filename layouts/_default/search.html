{{ define "main" }}
<h1 class="page-title">{{ .Title }}</h1>
<form id="search-form" class="search-box" action="{{ "/search/" | relURL }}" method="get" role="search">
  <input id="q" type="search" name="q" aria-label="検索キーワード" placeholder="タイトル、タグ、本文から検索" autocomplete="off">
</form>
<p id="search-count" class="card-meta" aria-live="polite"></p>
<div id="search-results" class="card-list" data-index-url="{{ "index.json" | relURL }}"></div>
{{ end }}

{{ define "scripts" }}
<script type="module" src="{{ "js/search.js" | relURL }}"></script>
{{ end }}
