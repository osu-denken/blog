<li class="carditem">
  <a href="{{ .RelPermalink }}">
    <span class="card-title">{{ .Title }}</span>
    <p class="card-excerpt">{{ .Plain | truncate 50 }}</p>
    <span class="card-date">{{ .Date.Format "2006-01-02" }}</span>
  </a>
  {{ partial "gh-admin/button.html" (dict "kind" "edit" "page" . "class" "card-edit" "label" "編集") }}
</li>
