<footer class="site-footer">
  <div class="wrapper">
    <h2 class="footer-heading">{{ site.Title }}</h2>
    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name">{{ site.Params.author | default site.Title }}</li>
        </ul>
      </div>
      <div class="footer-col footer-col-2">
        <a class="footer-rss" href="{{ "feed.xml" | relURL }}" type="application/rss+xml" title="RSS" aria-label="RSS">
          <i class="fa-solid fa-rss" aria-hidden="true"></i>
        </a>
        <a class="footer-rss" href="{{ "index.json" | relURL }}" title="JSON" aria-label="JSON">
          <i class="fa-solid fa-code" aria-hidden="true"></i>
        </a>
        {{ partial "gh-admin/button.html" (dict "kind" "footer" "page" .) }}
      </div>
    </div>
  </div>
</footer>
